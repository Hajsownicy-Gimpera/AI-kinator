services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    # These two lines keep Create React App from immediately exiting inside Docker
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Changed from 'dev' to 'start' to match your package.json
    command: npm run start