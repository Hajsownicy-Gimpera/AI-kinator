[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-kinator"
version = "1.0.0"
description = "A multiplayer LLM-powered guessing game using FastAPI"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-packages = false

[tool.uv]
required-version = "0.11.7"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
